<!DOCTYPE html> <!-- This is a comment -->
<html lang="en"> <!-- lang attribute is used to specify the language of the document -->
<head>   <!-- contain for meta data which are usefull but not displayed on web page -->
    <meta charset="UTF-8"> <!-- charset attribute is used to specify the character encoding for the HTML document -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- viewport meta tag is used to control the layout on mobile browsers -->
    <title>Document</title> <!-- title tag is used to specify the title of the document -->
</head>
<body> <!-- contain for content which are displayed on web page -->
    <h1>Welcome to my website</h1> <!-- h1 tag is used to define the most important heading -->
    <p>This is a sample paragraph.</p> <!-- p tag is used to define a paragraph -->
    
</body>
</html>
